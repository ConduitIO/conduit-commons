syntax = "proto3";

package schema.v1;

option go_package = "github.com/conduitio/conduit-commons/proto/schema/v1";

// Schema is a representation of a schema in the schema registry.
message Schema {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_AVRO = 1;
    TYPE_PROTOBUF = 2;
  }

  // The subject of the schema. Together with the version, this uniquely
  // identifies the schema.
  string subject = 1;
  // The version of the schema. Together with the subject, this uniquely
  // identifies the schema.
  int32 version = 2;

  // Uniquely identifies the schema contents (not the schema itself!).
  int32 id = 3;
  // The schema type.
  Type type = 4;
  // The schema contents.
  bytes bytes = 5;
  // The other registered schemas this schema refers to (for Protobuf, the
  // files it imports). Empty for a schema without references.
  repeated Reference references = 6;

  // Reference is a schema's reference to another registered schema.
  message Reference {
    // How the referencing schema refers to the other one. For Protobuf, the
    // import path.
    string name = 1;
    // The subject of the referenced schema.
    string subject = 2;
    // The version of the referenced schema.
    int32 version = 3;
  }
}
