name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Property tests are named for the nightly run
        # See .github/scripts/check-property-names/main.go for the rule; the
        # go test runs the checker's own fixtures first.
        run: |
          go test ./.github/scripts/check-property-names
          go run ./.github/scripts/check-property-names

      - name: Test
        # Property tests (pgregory.net/rapid) run a small, fixed number of
        # cases here. The nightly property workflow runs many more.
        env:
          RAPID_CHECKS: "100"
        run: make test-integration GOTEST_FLAGS="-v -count=1"
