name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Test
        # Property tests (pgregory.net/rapid) run a small, fixed number of
        # cases here. The nightly property workflow runs many more.
        env:
          RAPID_CHECKS: "100"
        run: make test-integration GOTEST_FLAGS="-v -count=1"
