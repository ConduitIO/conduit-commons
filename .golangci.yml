version: "2"
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - godot
    - goheader
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - importas
    - ineffassign
    - interfacebloat
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - thelper
    - unconvert
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
    - zerologlint
  settings:
    forbidigo:
      # Type-aware matching, so the rules below match the codec by import
      # path and not conduit-commons' own schema/avro package, which is
      # also named avro.
      analyze-types: true
      forbid:
        # conduit-commons#305 / #308: the Avro codec's package-level API shares
        # process-wide state. avro.DefaultConfig holds one encoder/decoder cache
        # for the whole process, keyed by the schema's String(), where a
        # reference to a named type is just its name. avro.DefaultSchemaCache
        # makes every parsed named type visible to every later parse. Two
        # pipelines in one process whose schemas share a type name then encode
        # with each other's definitions, and the bytes are written and acked
        # without an error. Encode and decode through conduit-commons
        # schema/avro (one isolated config per Serde), or build a private
        # avro.Config{}.Freeze() / &avro.SchemaCache{} owned by one schema.
        # The rule covers both codecs (hamba/avro and the iskorotkov fork).
        - pattern: '^avro\.(Marshal|Unmarshal|NewEncoder|NewDecoder|NewEncoderForSchema|NewDecoderForSchema|Register|RegisterTypeConverters|DefaultConfig|DefaultSchemaCache)$'
          pkg: '^github\.com/(hamba|iskorotkov)/avro/v2$'
          msg: the Avro codec's package-level API shares one cache per process and can encode with another schema's named types (conduit-commons#305) - use conduit-commons schema/avro, or a private avro.Config{}.Freeze() owned by one schema.
        - pattern: '^avro\.(Parse|ParseBytes|ParseFiles|MustParse|ParseWithCache|ParseBytesWithCache)$'
          pkg: '^github\.com/(hamba|iskorotkov)/avro/v2$'
          msg: parse Avro schemas through conduit-commons schema/avro.Parse; the codec's Parse/ParseBytes register named types in a process-wide cache (conduit-commons#308). A call that passes a fresh &avro.SchemaCache{} owned by one schema may be silenced with a `//nolint:forbidigo` saying so.
    goheader:
      values:
        regexp:
          copyright-year: 20[2-9]\d
      template-path: .golangci.goheader.template
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - (context.Context).Err()
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dogsled
          - dupl
          - errcheck
          - forcetypeassert
          - funlen
          - gocognit
          - gosec
          - maintidx
        path: _test\.go
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
